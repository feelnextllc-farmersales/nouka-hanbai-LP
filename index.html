<style>
  :root{
    --off-white:#FAF7F1;
    --ivory:#F1EBDD;
    --beige:#E3D6BC;
    --green:#2B4638;
    --green-deep:#1E3229;
    --brown:#6B5642;
    --gold:#B48849;
    --gold-light:#D2AD73;
    --ink:#2A2620;
    --line:rgba(43,70,56,0.18);
    --serif: 'Shippori Mincho', serif;
    --sans: 'Zen Kaku Gothic New', sans-serif;
    --maxw: 1180px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--off-white);
    color:var(--ink);
    font-family:var(--sans);
    font-weight:400;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px;}
  h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.02em;}
  .eyebrow{
    font-family:var(--sans);
    font-size:12.5px;
    letter-spacing:.28em;
    color:var(--gold);
    font-weight:500;
    display:inline-block;
    margin-bottom:18px;
    text-transform:uppercase;
  }
  .skip-link{position:absolute;left:-999px;top:0;background:var(--green);color:#fff;padding:10px 16px;z-index:999;}
  .skip-link:focus{left:12px;top:12px;}

  /* ---------- thread signature ---------- */
  #thread-svg{
    position:fixed;
    left:24px;
    top:0;
    height:100vh;
    width:2px;
    z-index:5;
    pointer-events:none;
    opacity:.55;
  }
  #thread-svg path{
    fill:none;
    stroke:var(--gold);
    stroke-width:1.4;
    stroke-linecap:round;
    stroke-dasharray:6 7;
  }
  .thread-node{
    position:absolute;
    left:19px;
    width:11px;height:11px;
    border-radius:50%;
    background:var(--off-white);
    border:2px solid var(--gold);
    transform:scale(.4);
    opacity:0;
    transition:transform .6s cubic-bezier(.2,.8,.2,1), opacity .6s ease;
    z-index:6;
  }
  .thread-node.is-on{transform:scale(1);opacity:1;background:var(--gold);}
  @media (max-width: 880px){
    #thread-svg, .thread-node{display:none;}
  }

  /* ---------- header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;
    z-index:100;
    background:rgba(250,247,241,0.0);
    transition:background .4s ease, box-shadow .4s ease, backdrop-filter .4s ease;
  }
  header.scrolled{
    background:rgba(250,247,241,0.92);
    backdrop-filter:blur(6px);
    box-shadow:0 1px 0 var(--line);
  }
  .nav-inner{
    max-width:var(--maxw);margin:0 auto;padding:20px 32px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .logo{
    font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.06em;
    color:var(--green-deep);
    text-decoration:none;
  }
  header.scrolled .logo, .hero-header .logo{color:var(--green-deep);}
  .hero-header:not(.scrolled) .logo{color:#fff;}
  nav.links{display:flex;gap:38px;list-style:none;margin:0;padding:0;}
  nav.links a{
    font-size:14.5px;text-decoration:none;font-weight:500;
    letter-spacing:.04em;
    color:var(--green-deep);
    position:relative;
    padding-bottom:4px;
  }
  .hero-header:not(.scrolled) nav.links a{color:#fff;}
  nav.links a::after{
    content:'';position:absolute;left:0;bottom:0;width:0;height:1px;background:currentColor;
    transition:width .3s ease;
  }
  nav.links a:hover::after{width:100%;}
  .nav-cta{
    font-size:13.5px;font-weight:500;letter-spacing:.06em;
    border:1px solid var(--green-deep);
    padding:10px 22px;border-radius:2px;
    text-decoration:none;white-space:nowrap;
    transition:background .3s ease,color .3s ease, border-color .3s ease;
  }
  .hero-header:not(.scrolled) .nav-cta{border-color:#fff;color:#fff;}
  .nav-cta:hover{background:var(--green-deep);color:#fff;}
  .hero-header:not(.scrolled) .nav-cta:hover{background:#fff;color:var(--green-deep);}
  .menu-btn{display:none;background:none;border:none;cursor:pointer;padding:8px;}
  .menu-btn span{display:block;width:22px;height:2px;background:var(--green-deep);margin:5px 0;transition:.3s;}
  .hero-header:not(.scrolled) .menu-btn span{background:#fff;}

  /* ---------- photo placeholder ---------- */
  .photo{
    position:relative;
    background:
      repeating-linear-gradient(135deg, rgba(43,70,56,0.07) 0 2px, transparent 2px 26px),
      linear-gradient(160deg, #DCD2BC 0%, #C9BC9E 100%);
    overflow:hidden;
    border-radius:2px;
  }
  .photo::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 60%);
  }
  .photo-cap{
    position:absolute;left:16px;bottom:16px;
    font-size:11.5px;letter-spacing:.12em;
    color:var(--green-deep);
    background:rgba(250,247,241,.86);
    padding:6px 12px;
    border-left:2px solid var(--gold);
    font-weight:500;
  }
  .photo-icon{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:.35;
  }
  .photo-icon svg{width:56px;height:56px;stroke:var(--green-deep);}
  .photo img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  }
  .photo.has-img::before{opacity:.5;mix-blend-mode:soft-light;}

  /* ---------- reveal ---------- */
  .reveal{opacity:0;transform:translateY(28px);transition:opacity .9s ease, transform .9s ease;}
  .reveal.is-visible{opacity:1;transform:translateY(0);}
  .reveal-delay-1{transition-delay:.12s;}
  .reveal-delay-2{transition-delay:.24s;}

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    height:100svh;min-height:640px;
    display:flex;align-items:flex-end;
    color:#fff;
    background:
      linear-gradient(180deg, rgba(20,32,25,.3) 0%, rgba(18,28,22,.55) 55%, rgba(12,20,15,.88) 100%),
      url("hero.jpg") center 30% / cover no-repeat;
  }
  .hero-inner{
    width:100%;
    padding-bottom:96px;
  }
  .hero-inner .wrap{max-width:var(--maxw);}
  .hero h1{
    font-size:clamp(32px, 5.4vw, 62px);
    line-height:1.5;
    font-weight:700;
    max-width:780px;
    letter-spacing:.03em;
  }
  .hero p.lede{
    margin-top:28px;max-width:520px;
    font-size:15.5px;line-height:2.05;
    color:rgba(255,255,255,.86);
    font-weight:300;
  }
  .hero-cta-row{margin-top:40px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
  .btn-primary{
    background:var(--gold);color:#fff;
    padding:16px 34px;border-radius:2px;
    text-decoration:none;font-size:14.5px;font-weight:500;letter-spacing:.08em;
    border:1px solid var(--gold);
    transition:background .3s ease, color .3s ease;
    display:inline-block;
  }
  .btn-primary:hover{background:transparent;color:#fff;}
  .btn-ghost{
    color:#fff;text-decoration:none;font-size:14px;letter-spacing:.06em;
    border-bottom:1px solid rgba(255,255,255,.5);
    padding-bottom:3px;
  }
  .scroll-cue{
    position:absolute;right:32px;bottom:34px;
    writing-mode:vertical-rl;
    font-size:11.5px;letter-spacing:.3em;color:rgba(255,255,255,.7);
    display:flex;align-items:center;gap:14px;
  }
  .scroll-cue::after{content:'';width:1px;height:46px;background:rgba(255,255,255,.5);animation:scrollpulse 2.2s ease-in-out infinite;}
  @keyframes scrollpulse{0%,100%{transform:scaleY(1);opacity:.4;}50%{transform:scaleY(.4);opacity:1;}}

  /* ---------- section generic ---------- */
  section{padding:132px 0;position:relative;}
  section.tight{padding:96px 0;}
  .section-head{max-width:640px;margin-bottom:64px;}
  .section-head h2{font-size:clamp(24px,3.4vw,36px);line-height:1.65;}
  .section-head p{margin-top:20px;font-size:15px;color:#55503f;font-weight:300;line-height:2;}

  /* ---------- philosophy (poetic) ---------- */
  .philosophy{text-align:center;}
  .philosophy .lines{
    font-family:var(--serif);
    font-size:clamp(19px,2.6vw,27px);
    line-height:2.3;
    color:var(--green-deep);
    max-width:680px;margin:0 auto;
  }
  .philosophy .lines .accent{color:var(--gold);}
  .philosophy .signature-line{
    margin:56px auto 0;width:64px;height:1px;background:var(--gold);
  }

  /* ---------- not / is ---------- */
  .not-is{background:var(--ivory);}
  .not-is-grid{display:flex;gap:70px;flex-wrap:wrap;align-items:center;}
  .not-list{flex:1 1 340px;min-width:280px;}
  .not-list li{
    list-style:none;font-size:16.5px;color:#877a63;
    text-decoration:line-through;text-decoration-color:rgba(180,136,73,.55);
    margin-bottom:20px;font-weight:400;
    padding-left:26px;position:relative;
  }
  .not-list li::before{content:'—';position:absolute;left:0;color:var(--gold);text-decoration:none;}
  .is-block{flex:1 1 380px;min-width:280px;}
  .is-block h3{font-size:clamp(26px,3.6vw,40px);color:var(--green-deep);line-height:1.55;}
  .is-block p{margin-top:22px;font-size:15px;color:#55503f;font-weight:300;max-width:440px;}

  /* ---------- strength split ---------- */
  .split{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;}
  .split.reverse .split-media{order:2;}
  .split-media .photo{aspect-ratio:4/5;}
  .split-copy .num{font-family:var(--serif);font-size:14px;color:var(--gold);letter-spacing:.18em;margin-bottom:18px;display:block;}
  .split-copy h3{font-size:clamp(22px,3vw,30px);line-height:1.6;color:var(--green-deep);}
  .split-copy p{margin-top:22px;font-size:15px;color:#55503f;font-weight:300;max-width:460px;}
  @media (max-width:880px){
    .split, .split.reverse{grid-template-columns:1fr;gap:40px;}
    .split.reverse .split-media{order:0;}
  }

  /* ---------- network (dark) ---------- */
  .network{
    background:var(--green-deep);color:var(--off-white);
  }
  .network .eyebrow{color:var(--gold-light);}
  .network .section-head h2{color:#fff;}
  .network .section-head p{color:rgba(250,247,241,.72);}
  .network-cols{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:20px;margin-bottom:8px;}
  .network-card{
    border:1px solid rgba(250,247,241,.16);
    padding:36px 32px;border-radius:2px;
  }
  .network-card h4{font-size:13.5px;letter-spacing:.14em;color:var(--gold-light);margin-bottom:22px;font-weight:500;font-family:var(--sans);}
  .network-card ul{margin:0;padding:0;list-style:none;}
  .network-card li{
    font-size:14.5px;padding:12px 0;border-bottom:1px dashed rgba(250,247,241,.15);
    color:rgba(250,247,241,.9);font-weight:300;
  }
  .network-card li:last-child{border-bottom:none;}

  /* ---------- founder message ---------- */
  .founder{background:var(--ivory);}
  .founder-grid{display:grid;grid-template-columns:340px 1fr;gap:76px;align-items:start;}
  .founder-media .photo{aspect-ratio:3/4;}
  .founder-quote{padding-top:6px;}
  .quote-lines{
    font-family:var(--serif);
    font-size:clamp(17px,2vw,20px);
    line-height:2.35;
    color:var(--green-deep);
    font-weight:500;
  }
  .quote-lines .accent{color:var(--gold);}
  .founder-name{
    margin-top:38px;font-size:15px;color:var(--brown);font-weight:500;
    letter-spacing:.04em;
  }
  .founder-name span{font-weight:300;color:#8a7f68;margin-left:4px;}
  @media (max-width:820px){
    .founder-grid{grid-template-columns:1fr;gap:36px;}
    .founder-media .photo{max-width:280px;}
  }

  .timeline{
    margin-top:96px;
    position:relative;
    padding-left:34px;
    border-left:1px solid var(--line);
  }
  .timeline-item{
    position:relative;
    padding:0 0 40px 30px;
  }
  .timeline-item:last-child{padding-bottom:0;}
  .timeline-item::before{
    content:'';position:absolute;left:-38.5px;top:4px;
    width:9px;height:9px;border-radius:50%;
    background:var(--off-white);border:2px solid var(--gold);
    box-sizing:border-box;
  }
  .timeline-item.final::before{background:var(--gold);}
  .t-mark{
    display:inline-block;
    font-family:var(--serif);font-size:14px;font-weight:600;
    color:var(--gold);letter-spacing:.08em;margin-bottom:8px;
  }
  .timeline-item p{margin:0;font-size:14.5px;color:#4a4636;font-weight:300;max-width:640px;line-height:1.95;}
  @media (max-width:600px){
    .timeline{padding-left:22px;}
    .timeline-item{padding-left:20px;}
    .timeline-item::before{left:-26.5px;}
  }
  @media (max-width:760px){.network-cols{grid-template-columns:1fr;}}

  /* ---------- services (farm) ---------- */
  .service-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
  .service-card{
    background:var(--off-white);
    padding:28px 26px;min-height:150px;
    display:flex;flex-direction:column;
  }
  .service-card .mark{width:22px;height:2px;background:var(--gold);flex:none;}
  .service-card .service-title{
    display:block;margin-top:16px;font-size:15px;font-weight:500;color:var(--green-deep);line-height:1.6;
    font-family:var(--sans);
  }
  .service-card .service-desc{
    margin:8px 0 0;font-size:12.5px;color:#8a7f68;font-weight:300;line-height:1.75;
  }
  @media (max-width:920px){.service-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){
    .service-grid{grid-template-columns:1fr;}
    .service-card{
      min-height:0;flex-direction:row;align-items:flex-start;gap:16px;padding:20px 22px;
    }
    .service-card .mark{width:16px;margin-top:9px;}
    .service-card .service-title{margin-top:0;}
    .service-card .service-text{flex:1;min-width:0;}
  }

  /* ---------- registration (販売担当登録) ---------- */
  .registration-card{
    background:var(--off-white);
    border:1px solid var(--line);
    border-top:3px solid var(--gold);
    border-radius:2px;
    padding:52px 44px;
    margin-bottom:60px;
  }
  .reg-badge{
    display:inline-block;font-size:12px;letter-spacing:.14em;color:var(--gold);
    border:1px solid var(--gold);border-radius:999px;padding:5px 16px;font-weight:500;
  }
  .registration-card h3{
    margin-top:20px;font-size:clamp(24px,3vw,32px);color:var(--green-deep);line-height:1.5;
  }
  .reg-lead{
    margin-top:10px;font-family:var(--serif);font-size:17px;color:var(--brown);font-weight:500;
  }
  .reg-desc{
    margin-top:26px;font-size:14.5px;color:#55503f;font-weight:300;line-height:2;max-width:760px;
  }
  .reg-body{
    margin-top:40px;
    display:grid;grid-template-columns:1.3fr 1fr;gap:52px;
    align-items:start;
  }
  .reg-includes h4{
    font-size:13px;letter-spacing:.1em;color:var(--brown);font-weight:500;margin-bottom:20px;
    font-family:var(--sans);
  }
  .reg-list{margin:0;padding:0;list-style:none;}
  .reg-list li{
    position:relative;padding-left:28px;margin-bottom:14px;
    font-size:14.5px;color:#3b382f;font-weight:400;line-height:1.8;
  }
  .reg-list li::before{
    content:'✓';position:absolute;left:0;top:0;color:var(--gold);font-weight:700;font-size:13px;
  }
  .reg-price{
    background:var(--ivory);border:1px solid var(--line);border-radius:2px;
    padding:32px 30px;text-align:center;
  }
  .reg-price-label{display:block;font-size:12.5px;letter-spacing:.1em;color:var(--brown);font-weight:500;}
  .reg-price-value{
    display:block;margin-top:14px;font-family:var(--serif);font-size:38px;color:var(--gold);font-weight:700;
  }
  .reg-price-value small{font-size:13px;color:#8a7f68;font-weight:400;margin-left:6px;}
  .reg-price-note{
    margin-top:18px;font-size:13px;color:#55503f;font-weight:300;line-height:1.9;text-align:left;
  }
  .reg-cta{
    display:block;margin-top:24px;text-align:center;color:#fff;padding:14px 20px;font-size:13.5px;
  }
  @media (max-width:880px){
    .registration-card{padding:38px 26px;}
    .reg-body{grid-template-columns:1fr;gap:34px;}
  }

  /* ---------- network service (仕入れネットワーク構築) ---------- */
  .network-intro{
    background:var(--off-white);
    border:1px solid var(--line);
    border-top:3px solid var(--gold);
    border-radius:2px;
    padding:48px 44px;
    margin-bottom:56px;
  }
  .network-intro .reg-badge{margin-bottom:0;}
  .network-intro h3{
    margin-top:20px;font-size:clamp(24px,3vw,32px);color:var(--green-deep);line-height:1.5;
  }
  .network-intro p{
    margin-top:20px;font-size:14.5px;color:#55503f;font-weight:300;line-height:2;max-width:720px;
  }
  .network-intro p + p{margin-top:14px;}

  .functions-head{
    text-align:center;margin-bottom:40px;
  }
  .functions-head span{
    font-size:13px;letter-spacing:.1em;color:var(--brown);font-weight:500;
  }
  .functions-head h4{
    margin-top:10px;font-size:20px;color:var(--green-deep);font-family:var(--serif);
  }

  .function-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:36px;
  }
  .function-card{
    background:var(--off-white);border:1px solid var(--line);border-radius:2px;
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  .function-card .photo{aspect-ratio:16/9;}
  .function-card .function-body{padding:28px 26px;}
  .function-card .function-label{
    font-size:12px;letter-spacing:.16em;color:var(--gold);font-weight:600;font-family:var(--sans);
  }
  .function-card h4{
    margin-top:10px;font-size:19px;color:var(--green-deep);font-weight:600;font-family:var(--serif);
  }
  .function-card p{
    margin-top:10px;font-size:13.5px;color:#55503f;font-weight:300;line-height:1.9;
  }
  .function-card p + p{margin-top:6px;}
  @media (max-width:880px){
    .network-intro{padding:36px 26px;}
    .function-grid{grid-template-columns:1fr;}
  }

  .network-mission{
    margin-top:64px;text-align:center;max-width:680px;margin-left:auto;margin-right:auto;
